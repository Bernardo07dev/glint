<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112" fill="none">
  <title>Glint App Icon — Flight Path G + Profile Bee</title>
  <!-- Rounded Square Surface in Warm Cloud with subtle Peach border -->
  <rect x="4" y="4" width="104" height="104" rx="26" fill="#FFFDF8" stroke="#F3EFE6" stroke-width="2"/>

  <!-- Initial 4-point Glint Sparkle -->
  <path d="M 38 78 L 40.5 84 L 46.5 86.5 L 40.5 89 L 38 95 L 35.5 89 L 29.5 86.5 L 35.5 84 Z" fill="#FFE07D"/>

  <!-- Lower 'g' descender in Peach Coral dots -->
  <path d="M 74 47 C 74 72, 75 96, 52 96 C 38 96, 33 87, 39 80" stroke="#FF9B85" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="1 9.5"/>

  <!-- Upper 'g' loop in Pastel Cobalt -->
  <path d="M 74 47 C 74 64, 38 66, 38 47 C 38 29, 70 28, 74 44" stroke="#5B8DEF" stroke-width="6" stroke-linecap="round"/>

  <!-- Profile Bee Mascot perched at top-right of 'g' -->
  <g transform="translate(74, 33) rotate(-16)">
    <ellipse cx="-6" cy="-11" rx="11" ry="6.5" transform="rotate(-12 -6 -11)" fill="#95E1B0"/>
    <ellipse cx="4" cy="-10" rx="8.5" ry="5" transform="rotate(14 4 -10)" fill="#95E1B0" opacity="0.82"/>
    <rect x="-15" y="-8" width="30" height="21" rx="10.5" fill="#FFE07D"/>
    <path d="M -5 -7.5 L -5 12.5 M 2.5 -7.5 L 2.5 12.5" stroke="#5B8DEF" stroke-width="3.8"/>
    <circle cx="9.5" cy="0.5" r="2.4" fill="#2D3142"/>
    <circle cx="10.3" cy="-0.3" r="0.9" fill="#FFFDF8"/>
    <ellipse cx="8.5" cy="4.5" rx="2.3" ry="1.4" fill="#FF9B85"/>
    <path d="M 11 -6 Q 15 -13 19 -11" stroke="#2D3142" stroke-width="2" stroke-linecap="round"/>
    <circle cx="19.5" cy="-11" r="2.2" fill="#FF9B85"/>
  </g>
</svg>
