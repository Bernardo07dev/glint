<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <title>Glint — GitHub Social Preview</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap');
    </style>
  </defs>

  <!-- Base Nuvem Quente -->
  <rect width="1280" height="640" fill="#FFFDF8" />

  <!-- Moldura interna sutil dentro da margem segura de 40pt (80px) -->
  <rect x="88" y="88" width="1104" height="464" rx="24" fill="#FFFDF8" stroke="#F3EFE6" stroke-width="1.5" />

  <!-- Logo oficial Glint centralizado opticamente -->
  <g transform="translate(488.84, 122.79) scale(1.1800)">

    <path d="M 38 80 L 40.8 86.5 L 47.3 89.3 L 40.8 92.1 L 38 98.6 L 35.2 92.1 L 28.7 89.3 L 35.2 86.5 Z" fill="#FFE07D"/>
    <path d="M 80 46 C 80 74, 81 101, 55 101 C 39 101, 33 91, 40 83" stroke="#FF9B85" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="1 10"/>
    <path d="M 80 46 C 80 65, 40 67, 40 46 C 40 26, 76 25, 80 43" stroke="#5B8DEF" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(80, 31) rotate(-16)">
      <ellipse cx="-6" cy="-11" rx="11" ry="6.5" transform="rotate(-12 -6 -11)" fill="#95E1B0"/>
      <ellipse cx="4" cy="-10" rx="8.5" ry="5" transform="rotate(14 4 -10)" fill="#95E1B0" opacity="0.82"/>
      <rect x="-15" y="-8" width="30" height="21" rx="10.5" fill="#FFE07D"/>
      <path d="M -5 -7.5 L -5 12.5 M 2.5 -7.5 L 2.5 12.5" stroke="#5B8DEF" stroke-width="3.8"/>
      <circle cx="9.5" cy="0.5" r="2.4" fill="#2D3142"/>
      <circle cx="10.3" cy="-0.3" r="0.9" fill="#FFFDF8"/>
      <ellipse cx="8.5" cy="4.5" rx="2.3" ry="1.4" fill="#FF9B85"/>
      <path d="M 11 -6 Q 15 -13 19 -11" stroke="#2D3142" stroke-width="2" stroke-linecap="round"/>
      <circle cx="19.5" cy="-11" r="2.2" fill="#FF9B85"/>
    </g>
    <rect x="108" y="20" width="9" height="56" rx="4.5" fill="#2D3142"/>
    <rect x="131" y="41" width="9" height="35" rx="4.5" fill="#5B8DEF"/>
    <path d="M 135.5 18 L 138.3 25 L 145.3 27.8 L 138.3 30.6 L 135.5 37.6 L 132.7 30.6 L 125.7 27.8 L 132.7 25 Z" fill="#FF9B85"/>
    <path d="M 156 45 L 156 72 M 156 54 C 156 41, 185 41, 185 55 L 185 72" stroke="#2D3142" stroke-width="9" stroke-linecap="round"/>
    <path d="M 211 26 L 211 66 C 211 72, 216 74, 223 73" stroke="#2D3142" stroke-width="9" stroke-linecap="round"/>
    <rect x="199" y="39" width="25" height="7.5" rx="3.75" fill="#FF9B85"/>

  </g>

  <!-- Headline editorial (Fraunces 500) -->
  <text
    id="headline"
    x="640"
    y="310"
    text-anchor="middle"
    fill="#2D3142"
    font-family="'Fraunces', Georgia, serif"
    font-size="40"
    font-weight="500"
    letter-spacing="-0.8"
  >Aprenda qualquer tema no ritmo da sua rotina</text>

  <!-- Subtítulo funcional (Plus Jakarta Sans 400) -->
  <text
    id="subtitle"
    x="640"
    y="348"
    text-anchor="middle"
    fill="#646B82"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="20"
    font-weight="400"
    letter-spacing="-0.2"
  >Mentor de IA com entrevista investigativa, plano sob medida e calendário diário</text>

  <!-- Faixa de ritmo semanal (superfícies da paleta Aquarela Viva) -->
  <g id="rhythm-strip">
    <rect x="224" y="400" width="832" height="90" rx="20" fill="#FFFFFF" stroke="#F3EFE6" stroke-width="1.5" />

    <!-- Seg (Concluído) -->
    <rect x="244" y="420" width="118" height="50" rx="12" fill="#EBF9F0" stroke="#95E1B0" stroke-width="1.5" />
    <g transform="translate(260, 437)">
      <path fill="#95E1B0" fill-rule="evenodd" clip-rule="evenodd" d="M13.5 8a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0M15 8A7 7 0 1 1 1 8a7 7 0 0 1 14 0m-3.9-1.55a.75.75 0 1 0-1.2-.9L7.419 8.858 6.03 7.47a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.13-.08z" />
    </g>
    <text x="284" y="450" fill="#2D3142" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" style="font-variant-numeric: tabular-nums;">Seg · 25m</text>

    <!-- Ter (Concluído) -->
    <rect x="372" y="420" width="118" height="50" rx="12" fill="#EBF9F0" stroke="#95E1B0" stroke-width="1.5" />
    <g transform="translate(388, 437)">
      <path fill="#95E1B0" fill-rule="evenodd" clip-rule="evenodd" d="M13.5 8a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0M15 8A7 7 0 1 1 1 8a7 7 0 0 1 14 0m-3.9-1.55a.75.75 0 1 0-1.2-.9L7.419 8.858 6.03 7.47a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.13-.08z" />
    </g>
    <text x="412" y="450" fill="#2D3142" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" style="font-variant-numeric: tabular-nums;">Ter · 20m</text>

    <!-- Qua (Hoje / Ativo) -->
    <rect x="500" y="420" width="124" height="50" rx="12" fill="#E8F0FE" stroke="#5B8DEF" stroke-width="1.5" />
    <g transform="translate(516, 437)">
      <path fill="#5B8DEF" fill-rule="evenodd" clip-rule="evenodd" d="M13.5 8a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0M15 8A7 7 0 1 1 1 8a7 7 0 0 1 14 0M8.75 4.5a.75.75 0 0 0-1.5 0V8a.75.75 0 0 0 .3.6l2 1.5a.75.75 0 1 0 .9-1.2l-1.7-1.275z" />
    </g>
    <text x="540" y="450" fill="#2D3142" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" style="font-variant-numeric: tabular-nums;">Qua · 30m</text>

    <!-- Qui (Agendado) -->
    <rect x="634" y="420" width="118" height="50" rx="12" fill="#F3EFE6" />
    <g transform="translate(650, 437)">
      <path fill="#646B82" fill-rule="evenodd" clip-rule="evenodd" d="M5.25 5.497a.75.75 0 0 1-.75-.75V4A1.5 1.5 0 0 0 3 5.5v1h10v-1A1.5 1.5 0 0 0 11.5 4v.75a.75.75 0 0 1-1.5 0V4H6v.747a.75.75 0 0 1-.75.75M10 2.5H6v-.752a.75.75 0 1 0-1.5 0V2.5a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h7a3 3 0 0 0 3-3v-6a3 3 0 0 0-3-3v-.75a.75.75 0 0 0-1.5 0zM3 8v3.5A1.5 1.5 0 0 0 4.5 13h7a1.5 1.5 0 0 0 1.5-1.5V8z" />
    </g>
    <text x="674" y="450" fill="#646B82" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" style="font-variant-numeric: tabular-nums;">Qui · 25m</text>

    <!-- Nota do Mentor -->
    <rect x="770" y="420" width="266" height="50" rx="12" fill="#FFF0E5" />
    <rect x="770" y="429" width="4" height="32" rx="2" fill="#FF9B85" />
    <path d="M 792 438 L 794 443 L 799 445 L 794 447 L 792 452 L 790 447 L 785 445 L 790 443 Z" fill="#FF9B85" />
    <text id="mentor-note" x="808" y="450" fill="#2D3142" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" style="font-variant-numeric: tabular-nums;">Ritmo da semana: 2 de 4 blocos</text>
  </g>
</svg>