<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 115" width="265" height="115" fill="none">
  <title>Glint Logo — Flight Path G + Bicolor Geometric Wordmark</title>
  <!-- Initial 4-point Glint Sparkle at bottom-left of 'g' -->
  <path d="M 38 80 L 40.8 86.5 L 47.3 89.3 L 40.8 92.1 L 38 98.6 L 35.2 92.1 L 28.7 89.3 L 35.2 86.5 Z" fill="#FFE07D"/>

  <!-- Lower 'g' descender: Peach Coral dotted flight trail -->
  <path d="M 80 46 C 80 74, 81 101, 55 101 C 39 101, 33 91, 40 83" stroke="#FF9B85" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- Upper 'g' loop: Pastel Cobalt continuous stroke -->
  <path d="M 80 46 C 80 65, 40 67, 40 46 C 40 26, 76 25, 80 43" stroke="#5B8DEF" stroke-width="6" stroke-linecap="round"/>

  <!-- Profile Bee Mascot perched at top-right of 'g' -->
  <g transform="translate(80, 31) rotate(-16)">
    <!-- Pistachio Wings -->
    <ellipse cx="-6" cy="-11" rx="11" ry="6.5" transform="rotate(-12 -6 -11)" fill="#95E1B0"/>
    <ellipse cx="4" cy="-10" rx="8.5" ry="5" transform="rotate(14 4 -10)" fill="#95E1B0" opacity="0.82"/>
    <!-- Pill Body in Sunny Butter -->
    <rect x="-15" y="-8" width="30" height="21" rx="10.5" fill="#FFE07D"/>
    <!-- Pastel Cobalt Stripes -->
    <path d="M -5 -7.5 L -5 12.5 M 2.5 -7.5 L 2.5 12.5" stroke="#5B8DEF" stroke-width="3.8"/>
    <!-- Eye & Catchlight -->
    <circle cx="9.5" cy="0.5" r="2.4" fill="#2D3142"/>
    <circle cx="10.3" cy="-0.3" r="0.9" fill="#FFFDF8"/>
    <!-- Peach Coral Cheek -->
    <ellipse cx="8.5" cy="4.5" rx="2.3" ry="1.4" fill="#FF9B85"/>
    <!-- Antenna with Peach Coral tip -->
    <path d="M 11 -6 Q 15 -13 19 -11" stroke="#2D3142" stroke-width="2" stroke-linecap="round"/>
    <circle cx="19.5" cy="-11" r="2.2" fill="#FF9B85"/>
  </g>

  <!-- Bicolor Geometric Vector Wordmark "lint" -->
  <!-- l -->
  <rect x="108" y="20" width="9" height="56" rx="4.5" fill="#2D3142"/>
  <!-- i stem (Pastel Cobalt) + 4-point star dot (Peach Coral) -->
  <rect x="131" y="41" width="9" height="35" rx="4.5" fill="#5B8DEF"/>
  <path d="M 135.5 18 L 138.3 25 L 145.3 27.8 L 138.3 30.6 L 135.5 37.6 L 132.7 30.6 L 125.7 27.8 L 132.7 25 Z" fill="#FF9B85"/>
  <!-- n -->
  <path d="M 156 45 L 156 72 M 156 54 C 156 41, 185 41, 185 55 L 185 72" stroke="#2D3142" stroke-width="9" stroke-linecap="round"/>
  <!-- t stem (Dark Slate) + crossbar (Peach Coral) -->
  <path d="M 211 26 L 211 66 C 211 72, 216 74, 223 73" stroke="#2D3142" stroke-width="9" stroke-linecap="round"/>
  <rect x="199" y="39" width="25" height="7.5" rx="3.75" fill="#FF9B85"/>
</svg>
